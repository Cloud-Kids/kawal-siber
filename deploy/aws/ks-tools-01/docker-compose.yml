# ==============================================================================
# KAWAL SIBER — ks-tools-01 Docker Compose Configuration
# Architecture: ACTIVE / ACTIVE Security Tools Agent Cluster
# Container Redundancy: tools-agent-a (Port 9001) & tools-agent-b (Port 9002)
# ==============================================================================
services:
  tools-agent-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TOOLS_AGENT_IMAGE:-kawal-siber-tools-agent:latest}
    container_name: tools-agent-a
    restart: unless-stopped
    environment:
      - TOOLS_AGENT_KEY=${TOOLS_AGENT_KEY:-KawalSiberToolsAgentAuthToken2026!}
      - MAX_CONCURRENT_SCANS=4
      - HOSTNAME=tools-agent-a
      - PYTHONUNBUFFERED=1
    ports:
      - "9001:9000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  tools-agent-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TOOLS_AGENT_IMAGE:-kawal-siber-tools-agent:latest}
    container_name: tools-agent-b
    restart: unless-stopped
    environment:
      - TOOLS_AGENT_KEY=${TOOLS_AGENT_KEY:-KawalSiberToolsAgentAuthToken2026!}
      - MAX_CONCURRENT_SCANS=4
      - HOSTNAME=tools-agent-b
      - PYTHONUNBUFFERED=1
    ports:
      - "9002:9000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

