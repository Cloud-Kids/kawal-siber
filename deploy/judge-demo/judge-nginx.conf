# Judge demo proxy — serves ONLY the isolated judge stack.
# Bound to 127.0.0.1:8081 on the host; reachable only via cloudflared.
events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting zone (10r/s per IP, burst 20)
    limit_req_zone $binary_remote_addr zone=judge_limit:10m rate=10r/s;

    server {
        listen 8081;
        server_name demo-kawal-siber.smkcloud.web.id;

        client_max_body_size 2M;   # judge mode is read-only; tiny uploads only

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;

        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Judge backend API — read-only enforced app-side
        location /api/v1/ {
            limit_req zone=judge_limit burst=20 nodelay;
            set $up_judge_backend http://judge-backend:8001;
            proxy_pass $up_judge_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Block docs/schema explicitly at proxy too
        location ~ ^/(docs|redoc|openapi\.json) { return 403; }

        location /_next/static/ {
            set $up_judge_frontend http://judge-frontend:3001;
            proxy_pass $up_judge_frontend;
            proxy_cache_valid 200 1h;
            access_log off;
        }

        location / {
            limit_req zone=judge_limit burst=20 nodelay;
            set $up_judge_frontend http://judge-frontend:3001;
            proxy_pass $up_judge_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Default server: reject any other hostname hitting this port
    server {
        listen 8081 default_server;
        server_name _;
        return 444;
    }
}
