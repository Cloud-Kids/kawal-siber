# ==============================================================================
# KAWAL SIBER — Production Nginx Reverse Proxy Configuration (Single Host)
# Routes public ingress (80/443) to internal Frontend (:3000) and Backend (:8000)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream services on internal Docker network (kawal_net)
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80)
    # Staging mode: direct access; Production mode: redirect to HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Maximum payload size (supports forensic PCAP, evidence & report uploads)
        client_max_body_size 50M;

        # Hardened HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Reverse Proxy Healthcheck
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Backend REST API Routes (/api/v1/)
        location /api/v1/ {
            proxy_pass http://backend_upstream/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Extended timeouts for long-running security scans & AI triage
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Next.js Static Optimization Caching
        location /_next/static/ {
            proxy_pass http://frontend_upstream/_next/static/;
            proxy_cache_valid 200 365d;
            access_log off;
        }

        # Frontend Application UI (Default Ingress)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443) — Uncomment when SSL certificate is provisioned
    # --------------------------------------------------------------------------
