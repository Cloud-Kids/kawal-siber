name: KAWAL SIBER — Scheduled Security & Vulnerability Scan

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-and-dependency-vulnerability-scan:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python Dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          echo "Scanning backend dependencies..."
          pip-audit -r backend/requirements.txt || true
          echo "Scanning worker dependencies..."
          pip-audit -r worker/requirements.txt || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Node.js Frontend Dependencies (npm audit)
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

  container-security-scan:
    name: Container Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Image for Scanning
        run: |
          docker build -t kawal-siber-backend:scan -f backend/Dockerfile backend

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kawal-siber-backend:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image for Scanning
        run: |
          docker build -t kawal-siber-frontend:scan -f frontend/Dockerfile frontend

      - name: Run Trivy Vulnerability Scanner on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kawal-siber-frontend:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
