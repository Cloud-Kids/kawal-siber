name: KAWAL SIBER — Production Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service_to_deploy:
        description: 'Specific service to deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - worker
          - tools-agent
      run_migration:
        description: 'Execute database migration before deployment'
        required: true
        default: true
        type: boolean

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: Verify Commit Integrity & Tag
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Release Tag
        id: set_tag
        run: |
          TAG="sha-${GITHUB_SHA::8}"
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying Release Tag: $TAG (Commit: $GITHUB_SHA)"

  build-and-push-ecr:
    name: Build & Push Images to Amazon ECR
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    environment: production
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'backend' || github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          docker build \
            --build-arg COMMIT_SHA=$GITHUB_SHA \
            -t $ECR_REGISTRY/kawal-siber-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/kawal-siber-backend:latest \
            -f kawal-siber/backend/Dockerfile kawal-siber/backend
          docker push $ECR_REGISTRY/kawal-siber-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/kawal-siber-backend:latest

      - name: Build and Push Frontend Image
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'frontend' || github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          docker build \
            --build-arg COMMIT_SHA=$GITHUB_SHA \
            -t $ECR_REGISTRY/kawal-siber-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/kawal-siber-frontend:latest \
            -f kawal-siber/frontend/Dockerfile kawal-siber/frontend
          docker push $ECR_REGISTRY/kawal-siber-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/kawal-siber-frontend:latest

      - name: Build and Push Worker Image
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'worker' || github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          docker build \
            --build-arg COMMIT_SHA=$GITHUB_SHA \
            -t $ECR_REGISTRY/kawal-siber-worker:$IMAGE_TAG \
            -t $ECR_REGISTRY/kawal-siber-worker:latest \
            -f kawal-siber/worker/Dockerfile kawal-siber
          docker push $ECR_REGISTRY/kawal-siber-worker:$IMAGE_TAG
          docker push $ECR_REGISTRY/kawal-siber-worker:latest

      - name: Build and Push Tools Agent Image
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'tools-agent' || github.event_name == 'push' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          docker build \
            --build-arg COMMIT_SHA=$GITHUB_SHA \
            -t $ECR_REGISTRY/kawal-siber-tools-agent:$IMAGE_TAG \
            -t $ECR_REGISTRY/kawal-siber-tools-agent:latest \
            -f kawal-siber/deploy/aws/ks-tools-01/Dockerfile kawal-siber/deploy/aws/ks-tools-01
          docker push $ECR_REGISTRY/kawal-siber-tools-agent:$IMAGE_TAG
          docker push $ECR_REGISTRY/kawal-siber-tools-agent:latest

  execute-db-migration:
    name: Run Database Migration Task (One-Off ECS Task)
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation, build-and-push-ecr]
    environment: production
    if: ${{ github.event.inputs.run_migration != false }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Run Serialized Alembic Migration Task
        env:
          CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME || 'kawal-siber-prod' }}
          TASK_DEF: ${{ vars.ECS_MIGRATION_TASK_DEF || 'kawal-siber-migration' }}
          SUBNETS: ${{ secrets.ECS_PRIVATE_SUBNETS }}
          SECURITY_GROUPS: ${{ secrets.ECS_TASK_SECURITY_GROUPS }}
        run: |
          echo "Starting standalone ECS migration task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --task-definition "$TASK_DEF" \
            --launch-type EC2 \
            --query "tasks[0].taskArn" \
            --output text)

          echo "Waiting for migration task ($TASK_ARN) to complete..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: Database migration task failed with exit code $EXIT_CODE!"
            aws ecs describe-tasks --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN" --query "tasks[0].containers[0].reason"
            exit 1
          fi
          echo "SUCCESS: Database migration completed cleanly (exit code 0)."

  deploy-ecs-services:
    name: Rolling Update ECS Services
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation, build-and-push-ecr, execute-db-migration]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Deploy Backend ECS Service
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'backend' || github.event_name == 'push' }}
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME || 'kawal-siber-prod' }}
          SERVICE: kawal-siber-backend-service
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          echo "Updating $SERVICE in cluster $CLUSTER..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

      - name: Deploy Frontend ECS Service
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'frontend' || github.event_name == 'push' }}
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME || 'kawal-siber-prod' }}
          SERVICE: kawal-siber-frontend-service
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          echo "Updating $SERVICE in cluster $CLUSTER..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

      - name: Deploy Worker ECS Service
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'worker' || github.event_name == 'push' }}
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME || 'kawal-siber-prod' }}
          SERVICE: kawal-siber-worker-service
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          echo "Updating $SERVICE in cluster $CLUSTER..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

      - name: Deploy Tools Agent ECS Service
        if: ${{ github.event.inputs.service_to_deploy == 'all' || github.event.inputs.service_to_deploy == 'tools-agent' || github.event_name == 'push' }}
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME || 'kawal-siber-prod' }}
          SERVICE: kawal-siber-tools-agent-service
          IMAGE_TAG: ${{ needs.pre-deploy-validation.outputs.image_tag }}
        run: |
          echo "Updating $SERVICE in cluster $CLUSTER..."
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

      - name: Wait for Services to Reach Steady State
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME || 'kawal-siber-prod' }}
        run: |
          echo "Waiting for services to stabilize..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services \
            kawal-siber-backend-service \
            kawal-siber-frontend-service \
            kawal-siber-worker-service \
            kawal-siber-tools-agent-service
          echo "All ECS services stabilized successfully."

  post-deploy-smoke-test:
    name: Post-Deployment Smoke Verification
    runs-on: ubuntu-latest
    needs: [deploy-ecs-services]
    environment: production
    steps:
      - name: Run Smoke Tests against Public ALB Ingress
        env:
          ALB_URL: ${{ vars.PRODUCTION_APP_URL || 'https://kawal-siber.mil.id' }}
        run: |
          echo "Verifying application availability at $ALB_URL..."
          # Backend Health
          curl -s -f --max-time 10 "$ALB_URL/api/v1/health" || { echo "ERROR: Backend health endpoint failed!"; exit 1; }
          # Frontend Home / Dashboard
          curl -s -f --max-time 10 "$ALB_URL/" >/dev/null || { echo "ERROR: Frontend root endpoint failed!"; exit 1; }
          echo "All smoke tests PASSED."

