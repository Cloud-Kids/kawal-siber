# ==============================================================================
# KAWAL SIBER — ks-worker-01 Docker Compose Configuration
# Architecture: ACTIVE / ACTIVE Concurrent Worker Pool
# Container Redundancy: worker-a & worker-b (PostgreSQL SKIP LOCKED Queue)
# ==============================================================================
services:
  worker-a:
    image: ${WORKER_IMAGE:-kawal-siber-worker:latest}
    container_name: worker-a
    restart: unless-stopped
    environment:
      - WORKER_ID=worker-a
      - DATABASE_URL=${DATABASE_URL:-postgresql://kawal_user:KawalSiberSecure2026!@ks-db-01:5432/kawal_siber}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
      - SCAN_ENABLED=true
      - NMAP_TIMEOUT_SECONDS=120
      - POLL_INTERVAL_SECONDS=2.0
      - STALE_JOB_TIMEOUT_MINUTES=10
      - TOOLS_AGENT_URL=${TOOLS_AGENT_URL:-http://ks-tools-01:9001}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-kawal-siber-storage-prod}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, time, os; t=os.path.getmtime('/tmp/worker_heartbeat') if os.path.exists('/tmp/worker_heartbeat') else 0; sys.exit(0 if (time.time() - t) < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-b:
    image: ${WORKER_IMAGE:-kawal-siber-worker:latest}
    container_name: worker-b
    restart: unless-stopped
    environment:
      - WORKER_ID=worker-b
      - DATABASE_URL=${DATABASE_URL:-postgresql://kawal_user:KawalSiberSecure2026!@ks-db-01:5432/kawal_siber}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
      - SCAN_ENABLED=true
      - NMAP_TIMEOUT_SECONDS=120
      - POLL_INTERVAL_SECONDS=2.0
      - STALE_JOB_TIMEOUT_MINUTES=10
      - TOOLS_AGENT_URL=${TOOLS_AGENT_URL:-http://ks-tools-01:9002}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-kawal-siber-storage-prod}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, time, os; t=os.path.getmtime('/tmp/worker_heartbeat') if os.path.exists('/tmp/worker_heartbeat') else 0; sys.exit(0 if (time.time() - t) < 30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

