# ==============================================================================
# KAWAL SIBER — ks-frontend-01 Docker Compose Configuration
# Architecture: ACTIVE / ACTIVE Next.js 15 Standalone Cluster
# Container Redundancy: frontend-a (Port 3001) & frontend-b (Port 3002)
# ==============================================================================
services:
  frontend-a:
    image: ${FRONTEND_IMAGE:-kawal-siber-frontend:latest}
    container_name: frontend-a
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://ks-lb-01:80}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend-b:
    image: ${FRONTEND_IMAGE:-kawal-siber-frontend:latest}
    container_name: frontend-b
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://ks-lb-01:80}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "3002:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

