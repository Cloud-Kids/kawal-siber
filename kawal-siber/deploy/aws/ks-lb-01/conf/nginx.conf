# ==============================================================================
# KAWAL SIBER — Nginx Distributed Reverse Proxy Configuration
# Active/Active Upstream Routing to Container-Redundant Clusters
# ==============================================================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with Real Client IP and upstream timing
    log_format combined_upstream '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 'rt=$request_time uct="$upstream_connect_time" '
                                 'uht="$upstream_header_time" urt="$upstream_response_time" '
                                 'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log combined_upstream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Trust AWS ALB CIDRs for Real IP
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # --------------------------------------------------------------------------
    # Upstream Clusters (2 Containers per Role)
    # --------------------------------------------------------------------------
    upstream frontend_cluster {
        least_conn;
        server ks-frontend-01:3001 max_fails=2 fail_timeout=5s;
        server ks-frontend-01:3002 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    upstream backend_cluster {
        least_conn;
        server ks-backend-01:8001 max_fails=2 fail_timeout=5s;
        server ks-backend-01:8002 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Main HTTP Server Block (Port 80 internally behind ALB)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ALB Liveness & Readiness Probe
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Backend Health Passthrough
        location /api/v1/health {
            proxy_pass http://backend_cluster/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Backend API Traffic
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Frontend Next.js Static Assets (Aggressive Caching)
        location /_next/static/ {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 365d;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend Next.js Web Traffic
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}

