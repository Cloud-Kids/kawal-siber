# ==============================================================================
# KAWAL SIBER — ks-lb-01 Docker Compose Configuration
# Architecture: ACTIVE / ACTIVE Nginx Reverse Proxy Cluster behind AWS ALB
# Container Redundancy: nginx-a (Port 8081) & nginx-b (Port 8082)
# ==============================================================================
services:
  nginx-a:
    image: nginx:1.25-alpine
    container_name: nginx-a
    restart: unless-stopped
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx-b:
    image: nginx:1.25-alpine
    container_name: nginx-b
    restart: unless-stopped
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8082:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

