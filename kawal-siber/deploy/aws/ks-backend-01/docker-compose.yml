# ==============================================================================
# KAWAL SIBER — ks-backend-01 Docker Compose Configuration
# Architecture: ACTIVE / ACTIVE FastAPI Backend Cluster
# Container Redundancy: backend-a (Port 8001) & backend-b (Port 8002)
# ==============================================================================
services:
  backend-a:
    image: ${BACKEND_IMAGE:-kawal-siber-backend:latest}
    container_name: backend-a
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://kawal_user:KawalSiberSecure2026!@ks-db-01:5432/kawal_siber}
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=1800
      - SECRET_KEY=${SECRET_KEY:-KawalSiberDistributedClusterSecretKey2026!}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - FRONTEND_URL=${FRONTEND_URL:-http://ks-lb-01}
      - TOOLS_AGENT_URL=${TOOLS_AGENT_URL:-http://ks-tools-01:9001}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-kawal-siber-storage-prod}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  backend-b:
    image: ${BACKEND_IMAGE:-kawal-siber-backend:latest}
    container_name: backend-b
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://kawal_user:KawalSiberSecure2026!@ks-db-01:5432/kawal_siber}
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=1800
      - SECRET_KEY=${SECRET_KEY:-KawalSiberDistributedClusterSecretKey2026!}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - FRONTEND_URL=${FRONTEND_URL:-http://ks-lb-01}
      - TOOLS_AGENT_URL=${TOOLS_AGENT_URL:-http://ks-tools-01:9002}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-kawal-siber-storage-prod}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-southeast-1}
      - PYTHONUNBUFFERED=1
    ports:
      - "8002:8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

