name: kawal-siber

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kawal-siber-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////data/kawal_siber.db
      - FRONTEND_URL=http://localhost:3000
      - PYTHONUNBUFFERED=1
    volumes:
      - kawal_siber_db:/data
      - kawal_siber_reports:/app/storage/reports
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - kawal_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: kawal-siber-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////data/kawal_siber.db
      - SCAN_ENABLED=false
      - NMAP_TIMEOUT_SECONDS=60
      - POLL_INTERVAL_SECONDS=3.0
      - PYTHONUNBUFFERED=1
    volumes:
      - kawal_siber_db:/data
    networks:
      - kawal_net
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kawal-siber-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://backend:8000
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kawal_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  kawal_net:
    driver: bridge

volumes:
  kawal_siber_db:
    name: kawal_siber_db
  kawal_siber_reports:
    name: kawal_siber_reports
